services:
  redis:
    image: redis:7-alpine
    container_name: geo-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    command: ['redis-server', '--save', '60', '1000', '--appendonly', 'no']
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16-alpine
    container_name: geo-postgres
    restart: unless-stopped
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: geo
      POSTGRES_PASSWORD: geo
      POSTGRES_DB: geo
    volumes:
      - postgres-data:/var/lib/postgresql/data

  worker:
    build: .
    container_name: geo-worker
    restart: unless-stopped
    command: ['npm', 'run', 'worker']
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://geo:geo@postgres:5432/geo
      WORKER_CONCURRENCY: '2'
    depends_on:
      - postgres
      - redis
    volumes:
      - raster-cache:/tmp/geo-rasters

volumes:
  redis-data:
  postgres-data:
  raster-cache:
